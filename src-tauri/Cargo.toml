[package]
name = "aethera"
version = "0.1.0"
description = "Launcher desktop per llama-server"
edition = "2021"
rust-version = "1.80"

[lib]
name = "aethera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aethera"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ureq = { version = "3", features = ["json"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
