# M-15 — Batteria di coding agentico, versione 1 (17-09-2026).
#
# Ogni compito è un repository fixture in `fixture/<fixture>` (quello che l'agente vede), più:
# - `nascosti/<fixture>`: test in più, copiati sopra la copia di lavoro solo al momento della verifica;
# - `soluzioni/<soluzione>`: file della soluzione di riferimento, usati solo da `congela.py`.
# L'agente lavora in una copia fuori dal repository e non vede né i test nascosti né le soluzioni.
#
# Verifica (verifica.py): i test visibili del fixture vengono rimessi com'erano, i nascosti copiati
# sopra, poi si eseguono i comandi di `verifica`; i file `protetti` devono avere lo stesso hash del
# fixture; i `controlli` sono espressioni regolari da contare nei sorgenti. Esito riuscito solo se
# tutto passa. Gli hash congelati stanno in `congelato.json`, scritto da `congela.py`.
#
# Tetti per livello: facile 12 turni / 7 min, media 20 / 15 min, difficile 30 / 20 min.
# Enunciati in inglese; tre compiti hanno la gemella in italiano (sufisso -it) sullo stesso fixture.

versione = 1

[toolchain.rust]
verifica = ["cargo test --quiet --offline"]
protetti = ["Cargo.toml", "tests/**"]

[toolchain.python]
verifica = ["python -m unittest discover -s tests -t ."]
protetti = ["tests/**"]

[toolchain.node]
verifica = ["node --test"]
protetti = ["package.json", "tests/**"]

[livello.facile]
max_turni = 12
max_secondi = 420

[livello.media]
max_turni = 20
max_secondi = 900

[livello.difficile]
max_turni = 30
max_secondi = 1200

# --------------------------------------------------------------------------------------------
[[compito]]
id = "rs-durata-en"
fixture = "rs-durata"
soluzione = "rs-durata"
toolchain = "rust"
lingua = "en"
livello = "facile"
tipo = "bug"
enunciato = """
The `durata` crate parses durations such as `1h30m`. Two things are wrong: `parse_duration("1h30m")` returns the wrong number of seconds, and input that ends with digits and no unit (for example `"90"` or `"1h30"`) is accepted instead of returning `DurationError::MissingUnit`. Fix both in the library. The rules are in README.md and in the doc comments.
Do not modify the existing tests. The task is done when `cargo test` passes.
"""

[[compito]]
id = "rs-durata-it"
fixture = "rs-durata"
soluzione = "rs-durata"
toolchain = "rust"
lingua = "it"
livello = "facile"
tipo = "bug"
enunciato = """
Il crate `durata` legge durate come `1h30m`. Ci sono due errori: `parse_duration("1h30m")` restituisce un numero di secondi sbagliato, e un testo che finisce con delle cifre senza unità (per esempio `"90"` o `"1h30"`) viene accettato invece di restituire `DurationError::MissingUnit`. Correggi entrambi nella libreria. Le regole sono nel README.md e nei commenti di documentazione.
Non modificare i test esistenti. Il compito è finito quando `cargo test` passa.
"""

