tipo = "bug"
enunciato = """
`textkit.slugify` does not do what its docstring says: accented letters are dropped instead of losing their accent ("Café au lait" must become "cafe-au-lait"), runs of symbols produce several separators, and `max_len` can leave a separator at the end. Fix `slugify` so that it follows its docstring exactly, for any `sep`. Use only the standard library.
Do not modify the existing tests. The task is done when `python -m unittest discover -s tests -t .` passes.
"""

