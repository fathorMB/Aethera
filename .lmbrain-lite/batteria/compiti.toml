[[compito]]
id = "rs-calc"
fixture = "rs-calc"
soluzione = "rs-calc"
toolchain = "rust"
lingua = "en"
livello = "difficile"
tipo = "bug-multifile"
enunciato = """
The `calc` evaluator does not follow the grammar in README.md: `2 ^ 3 ^ 2` should be 512, `-2 ^ 2` should be -4, `2 ^ -1` should be 0.5, and decimal literals such as `1.5` and `.5` are rejected. A literal with two dots such as `1.2.3` must give `CalcError::BadNumber("1.2.3")`. The causes are spread over the lexer and the parser. Fix them without changing the public API.
Do not modify the existing tests. The task is done when `cargo test` passes.
"""

[[compito]]
id = "rs-report"
fixture = "rs-report"
soluzione = "rs-report"
toolchain = "rust"
lingua = "en"
livello = "media"
tipo = "refactoring"
enunciato = """
`render_sales` and `render_expenses` in `src/lib.rs` duplicate the code that formats one line. Refactor: add `pub fn format_row(label: &str, cents: i64) -> String`, which returns one line exactly as the reports print it today (label padded to 20 columns, amount right-aligned in 10 with two decimals and a leading `-` when negative, then a newline), and make both reports use it for every line, TOTAL included. The output of both reports must not change. When you are done, the label padding `{:<20}` and the cents formatting `% 100` must each appear exactly once in `src/`.
Do not modify the existing tests. The task is done when `cargo test` passes.
"""
[[compito.controlli]]
glob = "src/**/*.rs"
regex = ':<20'
conteggio = 1
[[compito.controlli]]
glob = "src/**/*.rs"
regex = '%\s*100'
conteggio = 1

