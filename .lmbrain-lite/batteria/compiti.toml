[[compito]]
id = "py-ledger"
fixture = "py-ledger"
soluzione = "py-ledger"
toolchain = "python"
lingua = "en"
livello = "difficile"
tipo = "bug-multifile"
enunciato = """
The `ledger` package has several bugs around currency conversion. `convert` must round the exact result to the nearest cent with halves away from zero (it currently uses floats and `round`), must return an int, and must raise `UnknownCurrency` for a currency code that is not in the rate table, on either side. Transfers between accounts in different currencies credit the wrong amount, and a refused transfer must leave both accounts and their histories unchanged. Read the docstrings in `ledger/` for the exact rules.
`ledger/rates.py` is vendored data: do not modify it. Do not modify the existing tests. The task is done when `python -m unittest discover -s tests -t .` passes.
"""
protetti = ["ledger/rates.py"]

