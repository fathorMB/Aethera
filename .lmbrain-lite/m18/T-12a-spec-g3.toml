measure = "T-12a"
title = "G3 Coder-Next: decodifica speculativa a n-grammi contro nessuna speculazione (il decode vale il 70% di una sessione)"
base = "qwen3-coder-next.q4_k_m.vulkan"
repetitions = 3
warmup = 1

[[variant]]
name = "senza-speculazione"
note = "il profilo standard di oggi"

[[variant]]
name = "ngram-simple"
[variant.speculative]
type = "ngram-simple"

[[variant]]
name = "ngram-map-k"
[variant.speculative]
type = "ngram-map-k"

[[variant]]
name = "ngram-mod"
[variant.speculative]
type = "ngram-mod"

[[variant]]
name = "ngram-cache"
[variant.speculative]
type = "ngram-cache"

# Campionamento dichiarato nel profilo del G3 (quello che usa Nonio).
# «riscrittura»: il caso favorevole, l'agente che riscrive un file cambiando poco.
[[workload]]
name = "riscrittura-7k"
prompt = "prompt-7k.txt"
instruction = "Riscrivi per intero il file cmdline.rs qui sopra cambiando una cosa sola: la funzione `build_args` si chiama `compose_args`, ovunque compaia. Tutto il resto resta identico, commenti compresi. Rispondi con il solo codice."
n_predict = 768
temperature = 1.0
top_p = 0.95
top_k = 40
min_p = 0.01
seed = 1234

# «codice nuovo»: il caso sfavorevole.
[[workload]]
name = "codice-7k"
prompt = "prompt-7k.txt"
instruction = "Riscrivi in Rust la funzione `build_args` del file cmdline.rs in modo che gli argomenti vengano composti da una tabella dichiarativa invece che da chiamate ripetute, mantenendo esattamente lo stesso ordine e lo stesso comportamento. Rispondi con il solo codice."
n_predict = 384
temperature = 1.0
top_p = 0.95
top_k = 40
min_p = 0.01
seed = 1234
