# M-16 T-02b — ubatch 512, 1024, 2048, 4096 su b10991+moro0 (base) e +moro1 (int8 coopmat),
# Coder-Next G3 (profilo: ubatch 512, batch 2048, senza speculazione). Batch = max(2048, ubatch):
# il profilo usa 2048 e il batch deve essere >= ubatch. L'ubatch 4096 viene per ultimo: i pesi
# occupano già 46 GiB di VGM e il buffer di calcolo cresce con l'ubatch.
# Stesse regole di T-02a.
measure = "T-02b"
title = "ubatch con e senza int8 coopmat: Coder-Next G3"
base = "qwen3-coder-next.q4_k_m.vulkan"
repetitions = 3
warmup = 1

[[variant]]
name = "moro0-ub512"
note = "b10991+moro0, ubatch 512, batch 2048"
build = "b10991+moro0"
[variant.server]
ubatch = 512
batch = 2048

