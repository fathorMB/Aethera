# M-16 T-02a — ubatch 512, 1024, 2048, 4096 su b10991+moro0 (base) e +moro1 (int8 coopmat), 35B G1.
# Il profilo standard non si tocca: build e ubatch si cambiano variante per variante. MTP a 3 token
# come il profilo. Batch fisso a 4096 (quello del profilo, >= ogni ubatch): la variabile è l'ubatch.
# Per ogni ubatch base e patch sono avviate una dopo l'altra, così la deriva della macchina pesa
# uguale sulle due. Temperatura 0, seme 1234, nonce fisso per giro e testo intero: dice anche se
# cambiare solo l'ubatch cambia il testo (argomento di T-04). Procedura di M-08 con 3 giri e
# 1 riscaldamento. Si lancia con --riprendi (sequenza.py).
measure = "T-02a"
title = "ubatch con e senza int8 coopmat: 35B G1 (MTP come il profilo)"
base = "qwen3.6-35b-a3b.q4_k_m.vulkan"
repetitions = 3
warmup = 1

[[variant]]
name = "moro0-ub512"
note = "b10991+moro0, ubatch 512, batch 4096"
build = "b10991+moro0"
[variant.server]
ubatch = 512
batch = 4096

[[variant]]
name = "moro1-ub512"
note = "b10991+moro1, ubatch 512, batch 4096"
build = "b10991+moro1"
[variant.server]
