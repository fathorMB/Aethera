measure = "T-04a"
title = "Flash-Coder Q4_K_M a VGM 48, ctx 65536: prefill e decode con ~30k e ~60k token nel contesto"
base = "qwen3.8-flash-coder.q4_k_m.vulkan"
repetitions = 2
warmup = 1

# Stessi prompt congelati e stessa istruzione di M-10 T-08, per il confronto diretto con Flash-Next.
# Solo Q4_K_M: il Q8_0 (44,4 GiB dedicati a 32k, M-11 T-03) non lascia spazio al contesto a 64k.
[[variant]]
name = "q4_k_m-64k"
[variant.server]
ctx = 65536

[[workload]]
name = "contesto-30k"
prompt = "prompt-30k.txt"
instruction = "Summarize in English, in at most twelve lines, what this program does as a whole and where a wrong change would do the most damage."
n_predict = 256
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
seed = 1234

[[workload]]
name = "contesto-60k"
prompt = "prompt-60k.txt"
instruction = "Summarize in English, in at most twelve lines, what this program does as a whole and where a wrong change would do the most damage."
n_predict = 256
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
seed = 1234
