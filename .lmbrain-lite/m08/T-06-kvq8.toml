measure = "T-06"
title = "KV cache q8_0 contro f16 a 32k, 64k e 128k sul 35B"
base = "qwen3.6-35b-a3b.q4_k_m.vulkan"
repetitions = 3
warmup = 1

# Tre giri invece di cinque, e un carico solo: sei varianti da avviare una per volta, e il carico
# da 21k token costa 92 s a richiesta. Il carico corto e' stato tolto di proposito: la domanda qui
# e' che cosa costa la cache KV, e la cache KV si vede a contesto lungo. Lo scarto tipo su tre giri
# e' piu' largo: le differenze sotto il 3% non si leggono.

# Il contesto e' l'altra variabile, quindi le coppie si leggono a due a due: f16/q8_0 a parita' di ctx.
[[variant]]
name = "f16-32k"
[variant.server]
ctx = 32768
cache_type_k = "f16"
cache_type_v = "f16"

[[variant]]
name = "q8-32k"
[variant.server]
ctx = 32768
cache_type_k = "q8_0"
cache_type_v = "q8_0"

